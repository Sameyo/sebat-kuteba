name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds the app code. Generate the Android/iOS platform
      # folders, then put our own files back in case flutter create touched them.
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,ios --project-name sebat_kuteba --org com.savingstracker .
          git checkout -- lib pubspec.yaml analysis_options.yaml
          rm -rf test

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sebat-kuteba-apk
          path: build/app/outputs/flutter-apk/app-release.apk
